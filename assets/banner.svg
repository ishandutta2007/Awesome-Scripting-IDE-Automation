<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Pill border gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Radial glowing orbs -->
    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.95; }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.2) translate(20px, -15px); opacity: 0.9; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes streamDot {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes borderGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 250px 100px;
    }
    .orb-2 {
      animation: floatOrb2 10s ease-in-out infinite;
      transform-origin: 950px 220px;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.4;
    }
    .circuit-path {
      stroke: url(#primaryGrad);
      stroke-width: 2;
      stroke-dasharray: 12, 12;
      animation: dashCycle 35s linear infinite;
      opacity: 0.55;
    }
    .border-accent {
      animation: borderGlow 4s ease-in-out infinite;
    }
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .banner-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <circle class="orb-1" cx="220" cy="110" r="210" fill="url(#orbGlow1)" />
  <circle class="orb-2" cx="980" cy="230" r="240" fill="url(#orbGlow2)" />
  <circle cx="620" cy="180" r="160" fill="url(#orbGlow3)" />

  <!-- Subtle Blueprint / IDE Matrix Grid -->
  <g class="grid-layer">
    <line x1="100" y1="0" x2="100" y2="340" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="340" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="340" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="340" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="340" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="340" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="340" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="340" class="grid-line" />
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  </g>

  <!-- Flowing Dynamic Data / Automation Flow Lines -->
  <path d="M 60,80 L 350,80 L 450,150 L 800,150 L 920,80 L 1140,80" fill="none" class="circuit-path" />
  <path d="M 60,260 L 320,260 L 420,190 L 780,190 L 880,260 L 1140,260" fill="none" class="circuit-path" />

  <!-- Outer Rounded Tech Border -->
  <rect x="2" y="2" width="1196" height="336" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="border-accent" />

  <!-- Code Bracket / Terminal Glyph Graphic Icons (Left / Right Subtle Background) -->
  <g opacity="0.18">
    <text x="60" y="210" font-family="monospace" font-size="110" fill="#6366f1" font-weight="900">&lt;/&gt;</text>
    <text x="1030" y="210" font-family="monospace" font-size="95" fill="#ec4899" font-weight="900">{...}</text>
  </g>

  <!-- FOREGROUND CONTENT: Safe Layer to Ensure Crisp Readability -->

  <!-- Top Badges / Categorical Pills -->
  <g transform="translate(325, 45)">
    <!-- Pill 1: AI CODING AGENTS -->
    <g transform="translate(0, 0)">
      <rect width="168" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#6366f1" />
      <text x="28" y="19" class="pill-text" fill="#c7d2fe">AI CODING AGENTS</text>
    </g>

    <!-- Pill 2: SCRIPTING IDES -->
    <g transform="translate(182, 0)">
      <rect width="160" height="28" rx="14" fill="#0f2b38" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#06b6d4" />
      <text x="28" y="19" class="pill-text" fill="#a5f3fc">SCRIPTING IDES</text>
    </g>

    <!-- Pill 3: WORKFLOW AUTOMATION -->
    <g transform="translate(356, 0)">
      <rect width="194" height="28" rx="14" fill="#3b0728" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="16" cy="14" r="4" fill="#ec4899" />
      <text x="28" y="19" class="pill-text" fill="#fbcfe8">WORKFLOW ENGINES</text>
    </g>
  </g>

  <!-- Main Title Area -->
  <!-- Title Shadow for Contrast -->
  <text x="601" y="156" text-anchor="middle" class="banner-title" fill="#000000" opacity="0.5">Awesome Scripting IDE &amp; Automation</text>
  <!-- Foreground Title -->
  <text x="600" y="155" text-anchor="middle" class="banner-title">
    <tspan fill="#ffffff">Awesome </tspan>
    <tspan fill="url(#primaryGrad)">Scripting IDE</tspan>
    <tspan fill="#ffffff"> &amp; Automation</tspan>
  </text>

  <!-- Subtitle Area -->
  <text x="600" y="200" text-anchor="middle" class="banner-sub">
    Curated Hub of Autonomous Coding Agents, Terminal-Native Scripting Runtimes &amp; Self-Hosted Visual Automation
  </text>

  <!-- Decorative Feature Tag Bar -->
  <g transform="translate(230, 240)">
    <rect width="740" height="42" rx="21" fill="#0b1329" stroke="#334155" stroke-width="1" />
    
    <g transform="translate(30, 26)">
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Multi-File Agent Execution</text>
    </g>
    <circle cx="270" cy="21" r="3" fill="#64748b" />
    <g transform="translate(295, 26)">
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#a855f7">🤖 Terminal-Native Orchestration</text>
    </g>
    <circle cx="530" cy="21" r="3" fill="#64748b" />
    <g transform="translate(555, 26)">
      <text font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#34d399">🔒 Self-Hosted &amp; Open Source</text>
    </g>
  </g>
</svg>
